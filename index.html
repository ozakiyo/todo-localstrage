<!--
概要
LocalStorageを活用したタスク管理アプリケーションを 開発してください。

必須要件
1. 基本機能
 タスクの追加、編集、削除
 タスクの完了/未完了の切り替え
 すべてのデータをLocalStorageに永続化
 OK

2. 高度な機能
 優先度設定（高・中・低）と色分け表示
 期限設定と期限切れの視覚的な表示
 カテゴリ分け（仕事、プライベート、勉強など、自由に追加可能）
 検索機能（タスク名での部分一致検索）
 フィルター機能
完了/未完了での絞り込み
優先度での絞り込み
カテゴリでの絞り込み
 ソート機能
作成日時順
期限順
優先度順
3. データ構造
各タスクは最低限以下の情報を持つこと：

javascript

{
  id: number,           // 一意のID
  title: string,        // タスク名
  description: string,  // 詳細説明（任意）
  priority: string,     // 'high' | 'medium' | 'low'
  category: string,     // カテゴリ名
  dueDate: string,      // 期限(日付)
  completed: boolean,   // 完了状態
  createdAt: string,    // 作成日時
  updatedAt: string     // 更新日時
}

function createDateInfo(task){
  const topInfo = document.createElement("div");
  topInfo.classList.add("task-top-info");

  if(task.updated && task.updatedAt){
    //更新フラグがtrue
    const updated = new Date(task.updatedAt);
    if(!isNaN(updated)){
      //更新日処理：文字列が正しい日付になっているかどうかを確認するためのチェック
      topInfo.textContent = `更新日：${updated.toLocaleDateString("ja-JP")}`;
    }
  }else if(task.createdAt){
    //更新フラグがfalse
    const created = new Date(task.createdAt);
    if(!isNaN(created)){
      topInfo.textContent = `作成日：${created.toLocaleDateString("ja-JP")}`
    }
  }
  return topInfo;
}

/*ソート機能関数*/
      function sortTasks(data,sortType){
        //data配列から値の取得
        let sortedData = [...data]; //元データをコピー
        if(sortType === "dueDate"){
          //期限が近い順に並び替え
          sortedData.sort(function(a,b){
            if(!a.dueDate)return 1; //aが期限なし　後ろ
            if(!b.dueDate)return -1; //bが期限なし aが前
            const dateA = new Date(a.dueDate);
            const dateB = new Date(b.dueDate);
            return dateA - dateB; //早い日が先に来る
          });
        }else if(sortType === "priority"){
          //優先度の順（高、中、低）
          const order = {high:1,medium:2,low:3};
          sortedData.sort(function(a,b){
            const valueA = order[a.priority];
            const valueB = order[b.priority];
            if(valueA < valueB){
              return -1; //highが前に
            }else if(valueA > valueB){
              return 1; //lowが後に
            }else{
              return 0; //同じならそのまま
            }
          });
        }
        return sortedData;
      }

/*[renderTasks() タスクリストを表示関数]*/
      function renderTasks(){
        taskList.innerHTML = "";

        //期限日付表示　今日の日付
        const today = new Date().toISOString().slice(0,10);

        //検索キーワード
        const keyword = searchInput.value.trim().toLowerCase();

        //ソート機能エリア
        const sortType = sortSelector.value;
        const sortedData = sortTasks(data,sortType); //⑷sorttasks関数へ

        for(let index=0;index<sortedData.length;index++){
          const task = sortedData[index];

          //検索キーワードに部分一致しない場合はスキップ
          if(keyword && !task.text.toLowerCase().includes(keyword)){
            continue;
          }

          //フィルタ機能追加
          if(filterStatus.value === "completed" && !task.completed){
            //完了済みのみ表示、未完了はスキップ
            continue;
          }
          if(filterStatus.value === "incomplete" && task.completed){
            //未完了のみ表示、完了済みはスキップ
            continue;
          }
          if(filterPriority.value !== "all" && filterPriority.value !== task.priority){
            //優先度が一致しないものはスキップ
            continue;
          }
          if(filterCategory.value !== "all" && filterCategory.value !== task.category){
            //カテゴリが一致しないものはスキップ
            continue;
          }
          // /フィルタ機能追加
          
          //追加タスク表示
          const span = document.createElement("span");
          span.textContent = task.text;

          //詳細説明(任意)表示
          const descSpan = document.createElement("div");
          descSpan.textContent = task.description || "";
          //styleの追加
          descSpan.style.fontSize = "12px";
          descSpan.style.color = "#555";
          descSpan.style.marginLeft = "25px"; 
          
          const li = document.createElement("li");

          //期限日付表示
          if(task.dueDate){
            if(task.dueDate<today){
              li.classList.add("overdue");
            }else if(task.dueDate === today){
              li.classList.add("due-today");
            }
          }

          //優先度色分け表示
          li.classList.add(task.priority);

          //タスク表示部分HTML作成
          const titleRow = document.createElement("div");
          titleRow.classList.add("task-main-row");
          titleRow.appendChild(span);

          //詳細説明(任意)表示部分HTML作成
          const infoRow = document.createElement("div");
          infoRow.classList.add("task-main-row");
          infoRow.appendChild(descSpan);

          //期限日付表示部分HTML作成
          const dueSpan = document.createElement("span");
          dueSpan.classList.add("due-date");
          if(task.dueDate){
            dueSpan.textContent = `期限:${task.dueDate}`;
          } 
          infoRow.appendChild(dueSpan);

          //---カテゴリ表示部分HTML作成
          const catSpan = document.createElement("div");
          catSpan.classList.add("category-badge");
          catSpan.textContent = task.category || "未分類";
          infoRow.appendChild(catSpan);
/*------------/タスク追加エリア------------*/

/*作成日・更新日エリア*/
          const topInfo = createDateInfo(task);
          li.appendChild(topInfo);
/* /作成日・更新日エリア*/

          const buttonRow = document.createElement("div");
          buttonRow.classList.add("task-main-row");

          li.appendChild(titleRow);
          li.appendChild(infoRow);

          taskList.appendChild(li);
        }
      }
/*----------[renderTasks() タスクリストを表示関数]---------*/      

      //初期表示
      //---カテゴリ選択---
      renderCategories();
      //---検索機能---
      searchEvents();
      //---タスクリスト表示---
      renderTasks();
      
    </script>
